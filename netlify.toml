[build]
  node_version = "18"

[[headers]]
  for = "/*.ico"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "all"

[[headers]]
  for = "/*icon*.png"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Robots-Tag = "all"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"
    X-Robots-Tag = "all"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
